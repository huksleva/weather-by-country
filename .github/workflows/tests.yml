name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line help
        run: python main.py --help
      - name: Install package from pyproject.toml
        run: python -m pip install --no-deps .
      - name: Verify installed CLI and packaged resources outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          weather-by-country --help
          python -c "from pathlib import Path; import weather_by_country.main as app; from weather_by_country.report import write_report; assert len(app.load_cities(Path(app.__file__).with_name('cities.txt'))) == 8; data = [app.WeatherData('Test city', -7, 'Test country')]; path = write_report(Path('installed-report.html'), data, app.country_statistics(data), {}, 1); assert 'Test city' in path.read_text(encoding='utf-8')"

  docker:
    name: Docker / ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: amd64
          - os: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build test image and run offline tests
        run: |
          docker build --target test --tag weather-by-country:test .
          docker run --rm --network none --read-only --tmpfs /tmp weather-by-country:test
      - name: Build runtime image and check command-line help
        run: |
          docker compose build weather
          docker compose run --rm --no-deps weather --help
      - name: Verify bundled input and non-root user
        run: >-
          docker compose run --rm --no-deps --entrypoint python weather -c
          "from pathlib import Path; import main, os;
          assert os.getuid() != 0;
          assert len(main.load_cities(Path('/app/cities.txt'))) == 8"
      - name: Verify custom input with spaces, BOM and Unicode
        run: |
          python -c "from pathlib import Path; Path('work').mkdir(exist_ok=True); Path('work/cities for Docker.txt').write_text('\ufeffMoscow\nmoscow\nМосква\n', encoding='utf-8')"
          CITIES_FILE='./work/cities for Docker.txt' docker compose run --rm --no-deps --entrypoint python weather -c "from pathlib import Path; import main; assert main.load_cities(Path('/app/cities.txt')) == ['Moscow', 'Москва']"
      - name: Verify CLI error exit code through Compose
        run: |
          set +e
          docker compose run --rm --no-deps weather /app/missing-cities.txt
          status=$?
          set -e
          test "$status" -eq 2
      - name: Verify HTML persists in the Docker volume without external network calls
        run: |
          docker compose run --rm --no-deps --entrypoint python weather -c "from unittest.mock import patch; import main; mock = patch('main.fetch_weather', side_effect=lambda city, *args: main.WeatherData(city, -7, 'Test country')); mock.start(); raise SystemExit(main.main(['--report', '/reports/ci-report.html']))"
          docker compose run --rm --no-deps --entrypoint python weather -c "from pathlib import Path; text = Path('/reports/ci-report.html').read_text(encoding='utf-8'); assert '<html lang=' in text; assert 'Test country' in text; assert '-7' in text; assert '{{' not in text"
      - name: Verify browser report through the published port
        run: |
          docker compose run --rm -d --name weather-report-ci --service-ports --entrypoint python weather -c "from unittest.mock import patch; import main; mock = patch('main.fetch_weather', side_effect=lambda city, *args: main.WeatherData(city, -7, 'Test country')); mock.start(); raise SystemExit(main.main(['--serve', '--no-open']))"
          python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen
          for attempt in range(30):
              try:
                  with urlopen('http://127.0.0.1:8000/', timeout=2) as response:
                      assert 'Test country' in response.read().decode('utf-8')
                  with urlopen('http://127.0.0.1:8000/download', timeout=2) as response:
                      assert 'attachment' in response.headers['Content-Disposition']
                  break
              except URLError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Report server did not start')
          PY
      - name: Stop test report server
        if: always()
        run: docker rm -f weather-report-ci 2>/dev/null || true
