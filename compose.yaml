services:
  weather:
    image: weather-by-country:local
    build:
      context: .
      target: runtime
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${CITIES_FILE:-./cities.txt}
        target: /app/cities.txt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./reports
        target: /reports
        bind:
          create_host_path: true
