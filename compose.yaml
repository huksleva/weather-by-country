services:
  weather:
    image: weather-by-country:local
    build:
      context: .
      target: runtime
    command: ["--serve", "--no-open"]
    ports:
      - "127.0.0.1:${REPORT_PORT:-8000}:8000"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${CITIES_FILE:-./cities.txt}
        target: /app/cities.txt
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: weather-reports
        target: /reports

volumes:
  weather-reports:
